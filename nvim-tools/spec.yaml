# Docker Sandboxes kit that adds Neovim to the agent's sandbox and installs the config's plugins and
# Mason tools (StyLua included) on startup. Used by ../sbxenv.yaml.
# We use v2 because the pi specs is locked to v2 and v3 can't be combined with it
# https://hub.docker.com/r/sbx/pi-kit#pi
# https://docs.docker.com/ai/sandboxes/customize/kits-v2/#schema-versions
schemaVersion: "2"
kind: mixin
name: nvim-tools
description: Neovim 0.12+ for the nvim config
args:
    nvim_version:
        default: stable

permissions:
    network:
        allow:
            - github.com
            - "*.githubusercontent.com"
            - registry.npmjs.org
            - proxy.golang.org
            - sum.golang.org
            - skills.sh
            - www.skills.sh
            - mcp.exa.ai
            - html.duckduckgo.com
            - api.keenable.ai
            - r.jina.ai

environment:
    variables:
        EDITOR: nvim
        VISUAL: nvim

setup:
    install:
        # We use the direct url because apt is always outdated
        - description: Install Neovim
          command: |
              set -eu
              curl -fsSL "https://github.com/neovim/neovim/releases/download/${{ kit.args.nvim_version }}/nvim-linux-x86_64.tar.gz" | tar -xz -C /opt
              ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
    startup:
        # Neovim looks for ~/.config/nvim, but the sandbox HOME is /home/agent and the workspace keeps its host path.
        # Not in background, so the next step only starts once the link exists.
        - description: Link ~/.config/nvim to the workspace config
          command:
              - sh
              - -c
              - mkdir -p ~/.config && ln -sfn "$WORKSPACE_DIR" ~/.config/nvim
        - description: Install plugins and Mason tools for the workspace config
          background: true
          command:
              - nvim
              - --headless
              - +MasonToolsInstallSync
              - +qa
